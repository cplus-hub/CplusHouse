baseURL = 'https://cplus-hub.github.io/CplusHouse' # 請換成您未來的真實網址
languageCode = 'zh-tw'
title = 'CPlus House'
theme = [] # 暫時使用自定義 Layout，不依賴外部主題

[pagination]
  pagerSize = 10 # 設定每頁顯示 10 篇文章

[outputs]
  # 讓首頁除了生成 HTML 外，也生成 JSON (供搜尋使用)
  home = ["HTML", "RSS", "JSON"]

[params]
  author = "CPlus"
  bio = "隨興開發些玩意。"
  github = "https://github.com/cplus-hub" # 範例：請換成您自己的 GitHub 個人檔案網址
  email = "mailto:welcome3345@gmail.com" # 範例：請換成您自己的 Email

  # 技能列表 (模擬 README 中的 Skills 區塊)
  [[params.skills]]
    name = "PHP"
  [[params.skills]]
    name = "jQuery"
  [[params.skills]]
    name = "Java"
  [[params.skills]]
    name = "C"
